---

- name: Security Content Automation Protocol (SCAP) Remediation
  hosts: "{{ target | default('all') }}"
  gather_facts: true
  become: true
  tags:
    - scap
    - scap_remediation
  vars:
    # Profile ID passed to oscap.
    #
    # Discover available profiles for a given datastream:
    #   oscap info --profiles <scap_datastream>
    #
    # Common RHEL profile IDs:
    #   CIS L1 Server:  xccdf_org.ssgproject.content_profile_cis_server_l1
    #   CIS L2 Server:  xccdf_org.ssgproject.content_profile_cis
    #   DISA STIG:      xccdf_org.ssgproject.content_profile_stig
    #   FIPS 140:       xccdf_org.ssgproject.content_profile_fips
    #   PCI-DSS:        xccdf_org.ssgproject.content_profile_pci-dss
    #
    # Example CIS L2 Server
    # scap_profile: xccdf_org.ssgproject.content_profile_cis

    # List of XCCDF rule exceptions for the tailoring profile.
    # Leave empty ([]) to run the upstream profile unmodified.
    #
    # Each entry documents why a rule is modified alongside the rule ID.
    # status: "deselected" skips the rule entirely; "selected" re-enables a rule
    # that the base profile has turned off.
    #
    # Required fields : name, status, justification
    # Optional fields : owner, change_control, review_date
    #
    # Example (IdM host — CIS L2 removes packages that are hard deps of ipa-server):
    #   scap_tailoring_exceptions:
    #     - name: xccdf_org.ssgproject.content_rule_package_bind_removed
    #       status: deselected
    #       justification: bind is a hard dependency of ipa-server-dns
    #       owner: security-team
    #       change_control: CC-2024-0001
    #       review_date: 2026-01-01

    scap_datastream: "/usr/share/xml/scap/ssg/content/ssg-rhel{{ ansible_distribution_major_version }}-ds.xml"

    scap_results_dir: "/var/log/scap"
    scap_report_prefix: "scap-remediation"
    scap_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
    scap_log_file: "{{ scap_results_dir }}/{{ scap_report_prefix }}-{{ scap_timestamp }}.log"
    scap_report_file: "{{ scap_results_dir }}/{{ scap_report_prefix }}-report-{{ scap_timestamp }}.html"
    scap_results_file: "{{ scap_results_dir }}/{{ scap_report_prefix }}-results-{{ scap_timestamp }}.xml"
    scap_tailoring_file: "{{ scap_results_dir }}/{{ scap_report_prefix }}-tailoring-{{ scap_timestamp }}.xml"
  pre_tasks:
    - name: SCAP Profile
      ansible.builtin.debug:
        msg: "{{ scap_profile | default('undefined') }}"

    - name: Setup SCAP results directory
      ansible.builtin.file:
        path: "{{ scap_results_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      when: scap_profile is defined and scap_profile | length > 0
  tasks:
    - name: Generate SCAP tailoring file
      ansible.builtin.copy:
        dest: "{{ scap_tailoring_file }}"
        owner: root
        group: root
        mode: "0640"
        content: |
          <?xml version="1.0" encoding="UTF-8"?>

          <xccdf:Tailoring xmlns:xccdf="http://checklists.nist.gov/xccdf/1.2" id="xccdf_scap_tailoring_{{ inventory_hostname | regex_replace('[^a-zA-Z0-9]', '_') }}">

            <xccdf:benchmark href="{{ scap_datastream }}"/>

            <xccdf:version time="{{ ansible_date_time.iso8601 }}">1</xccdf:version>

            <xccdf:Profile id="{{ scap_profile }}_tailored" extends="{{ scap_profile }}">

              <xccdf:title>{{ scap_tailoring_title | default(scap_profile | regex_replace('xccdf_org.*.content_profile_', '') | upper + ' tailored for ' + inventory_hostname) }}</xccdf:title>

              <xccdf:description>{{ scap_tailoring_description | default(scap_profile | regex_replace('xccdf_org.*.content_profile_', '') | upper + ' profile tailored with ' + (scap_tailoring_exceptions | length | string) + ' exceptions for ' + inventory_hostname) }}</xccdf:description>
          {% for exception in scap_tailoring_exceptions %}

          {% if exception.owner is defined or exception.change_control is defined or exception.review_date is defined or exception.justification is defined %}
              <!--
          {% if exception.owner is defined %}
                owner          : {{ exception.owner | replace('--', '- -') }}
          {% endif %}
          {% if exception.change_control is defined %}
                change_control : {{ exception.change_control | replace('--', '- -') }}
          {% endif %}
          {% if exception.review_date is defined %}
                review_date    : {{ exception.review_date | replace('--', '- -') }}
          {% endif %}
          {% if exception.justification is defined %}
                justification  : {{ exception.justification | replace('--', '- -') }}
          {% endif %}
              -->
          {% endif %}
              <xccdf:select idref="{{ exception.name }}" selected="{{ 'false' if exception.status == 'deselected' else 'true' }}"/>
          {% endfor %}
            </xccdf:Profile>
          </xccdf:Tailoring>
      when:
        - scap_profile is defined and scap_profile | length > 0
        - scap_tailoring_exceptions is defined and scap_tailoring_exceptions | length > 0

    - name: Run SCAP remediation
      ansible.builtin.command:
        cmd: >-
          oscap xccdf eval
          --remediate
          --profile {{ (scap_profile ~ '_tailored') if scap_tailoring_exceptions is defined and scap_tailoring_exceptions | length > 0 else scap_profile }}
          --results {{ scap_results_file }}
          {{ ('--tailoring-file ' ~ scap_tailoring_file) if scap_tailoring_exceptions is defined and scap_tailoring_exceptions | length > 0 else '' }}
          {{ scap_datastream }}
      register: oscap_result
      # oscap exits 2 when rule failures remain after remediation, 0 when all pass
      failed_when: oscap_result.rc not in [0, 2]
      changed_when: oscap_result.rc == 2
      when: scap_profile is defined and scap_profile | length > 0

    - name: Write SCAP remediation log file
      ansible.builtin.copy:
        content: "{{ oscap_result.stdout }}\n\n{{ oscap_result.stderr }}"
        dest: "{{ scap_log_file }}"
        owner: root
        group: root
        mode: "0640"
      when: scap_profile is defined and scap_profile | length > 0

    - name: Print SCAP summary
      ansible.builtin.debug:
        msg: "{{ oscap_result.stdout_lines }}"
      when:
        - scap_profile is defined and scap_profile | length > 0
        - scap_report_dir is not defined or scap_report_dir | length == 0
  post_tasks:
    - name: Stat the SCAP results
      ansible.builtin.stat:
        path: "{{ scap_results_file }}"
      register: scap_results_stat
      when: scap_profile is defined and scap_profile | length > 0

    - name: Confirm results were written
      ansible.builtin.assert:
        that: scap_results_stat.stat.exists
        fail_msg: "SCAP XML results were not written — check {{ scap_log_file }}."
        success_msg: "SCAP results: {{ scap_results_file }}"
      when: scap_profile is defined and scap_profile | length > 0

    - name: Generate SCAP HTML report
      ansible.builtin.command:
        cmd: >
          oscap xccdf generate report
          --output {{ scap_report_file }}
          {{ scap_results_file }}
      register: report_result
      failed_when: report_result.rc > 0
      changed_when: report_result.rc == 0
      when: scap_profile is defined and scap_profile | length > 0

    - name: Fetch SCAP report and results
      ansible.builtin.fetch:
        src: "{{ item }}"
        dest: "{{ scap_report_dir }}"
        flat: false
      loop: >-
        {{
          [scap_log_file, scap_report_file, scap_results_file] +
          ([scap_tailoring_file] if scap_tailoring_exceptions is defined and scap_tailoring_exceptions | length > 0 else [])
        }}
      when:
        - scap_profile is defined and scap_profile | length > 0
        - scap_report_dir is defined and scap_report_dir | length > 0
