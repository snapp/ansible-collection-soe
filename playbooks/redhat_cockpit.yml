---

- name: Red Hat Cockpit
  hosts: "{{ target_hosts | default('redhat:!identity_management:!satellite') }}"
  gather_facts: false
  become: true
  tags:
    - redhat
    - cockpit
  tasks:
    - name: Install Red Hat Cockpit
      tags: cockpit_install
      block:
        - name: Configure Cockpit Certificate
          ansible.builtin.include_role:
            name: infra.soe.redhat_cockpit
            tasks_from: certificate
            apply:
              tags: redhat_idm_service
          tags: redhat_idm_service
          when: redhat_cockpit_idm_service_principal is defined
          vars:
            ipaadmin_password: "{{ idm_admin_password }}"

        - name: Run Cockpit Installer
          ansible.builtin.import_role:
            name: infra.soe.redhat_cockpit
            tasks_from: install
