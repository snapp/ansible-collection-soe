---
# Initially register IdM directly to Red Hat CDN
# Install and configure IdM fully
# Later re-register IdM to Satellite once Satellite exists

- name: Red Hat Identity Management (IdM)
  hosts: "{{ target_hosts | default('identity_management') }}"
  gather_facts: false
  become: true
  tags:
    - redhat
    - idm
    - idm_install
    - idm_server
    - idm_replica
  tasks:
    - name: Gather facts for all IdM peers to identify default_ipv4
      ansible.builtin.import_role:
        name: infra.soe.redhat_identity_management
        tasks_from: network

- name: Install Red Hat Identity Management (IdM) Server
  hosts: idm_server
  gather_facts: true
  become: true
  tags:
    - redhat
    - idm
    - idm_install
    - idm_server
  vars:
    ipadm_password: "{{ idm_admin_password }}"
    ipaadmin_password: "{{ idm_admin_password }}"
  roles:
    - role: redhat.rhel_idm.ipaserver

- name: Install Red Hat Identity Management (IdM) Replica
  hosts: idm_replica
  gather_facts: true
  become: true
  tags:
    - redhat
    - idm
    - idm_install
    - idm_replica
  vars:
    ipadm_password: "{{ idm_admin_password }}"
    ipaadmin_password: "{{ idm_admin_password }}"
  pre_tasks:
    # REDO|2024-05-08| Document the need for this task (CIS-L2?)
    - name: Change umask to 022
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        regexp: '^umask 077'
        line: umask 022
      with_items:
        - /etc/profile
        - /etc/bashrc
  roles:
    - role: redhat.rhel_idm.ipaclient

    - role: redhat.rhel_idm.ipareplica
  post_tasks:
    # REDO|2024-05-08| Document the need for this task (CIS-L2?)
    - name: Change umask back to 077
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        regexp: '^umask 022'
        line: umask 077
      with_items:
        - /etc/profile
        - /etc/bashrc

- name: Configure Red Hat Identity Management (IdM)
  hosts: "{{ groups['idm_server'][0] | default(omit) }}"
  tags:
    - redhat
    - idm
    - idm_server
    - idm_replica
    - idm_configure
  vars:
    ipaadmin_password: "{{ idm_admin_password }}"
  module_defaults:
    group/redhat.rhel_idm.modules:
      ipaadmin_password: "{{ idm_admin_password }}"
  pre_tasks:
    - name: Kerberos init as IdM admin for IPA CLI
      ansible.builtin.shell: |
        set -euo pipefail
        echo '{{ idm_admin_password }}' | kinit admin
      args:
        executable: /bin/bash
      changed_when: false
      no_log: "{{ no_log_enabled | default(true) }}"
      tags:
        - redhat_idm_users

    - name: Set IdM global defaults
      redhat.rhel_idm.ipaconfig:
        defaultgroup: "{{ idm_default_group }}"
        defaultshell: "{{ idm_default_shell }}"
        emaildomain: "{{ idm_default_email_domain }}"
        homedirectory: "{{ idm_default_home_directory }}"
        searchrecordslimit: "{{ idm_default_search_size_limit }}"
        enable_sid: "{{ idm_enable_sid | default(omit) }}"
        add_sids: "{{ idm_add_sids | default(omit) }}"
  roles:
    - role: infra.soe.redhat_idm_acme
      tags: redhat_idm_acme

    - role: infra.soe.redhat_idm_users
      tags: redhat_idm_users

    - role: infra.soe.redhat_idm_groups
      tags: redhat_idm_groups

    - role: infra.soe.redhat_idm_sudo
      tags: redhat_idm_sudo

    - role: infra.soe.redhat_idm_hbac
      tags: redhat_idm_hbac
  tasks:
    - name: Set password policy for service accounts
      redhat.rhel_idm.ipapwpolicy:
        name: service-accounts
        maxlife: "{{ idm_service_account_max_life }}"
        priority: 0

    - name: Set password policy for administrator accounts
      redhat.rhel_idm.ipapwpolicy:
        name: admin-accounts
        maxlife: "{{ idm_admin_account_max_life }}"
        priority: 1

    - name: Set external IP address for the primary DNS domain
      redhat.rhel_idm.ipadnsrecord:
        zone_name: "{{ idm_domain }}"
        records:
          - name: "@"
            record_type: A
            record_value: "{{ idm_domain_external_ip_address }}"
      when: idm_domain_external_ip_address is defined and idm_domain_external_ip_address | length > 0

    - name: Set DNS Global Forwarders to `only` policy
      redhat.rhel_idm.ipadnsconfig:
        forwarders: "{{ idm_global_forwarders | default([]) }}"
        forwardpolicy: only

    - name: Set DNS Forward Zones
      redhat.rhel_idm.ipadnsforwardzone:
        name: "{{ item.name }}"
        forwarders: "{{ item.forwarders | flatten }}"
        forwardpolicy: "{{ item.policy }}"
        skip_overlap_check: "{{ item.skip_overlap_check | default(false) }}"
      loop: "{{ idm_forwarder_zones | default([]) }}"

    - name: Allow synchronization of forward (A, AAAA) and reverse (PTR) records.
      redhat.rhel_idm.ipadnszone:
        name: "{{ item }}"
        allow_sync_ptr: true
        dynamic_update: true
      loop: "{{ (idm_dns_zones | default([])) + (ipaserver_reverse_zones | default([])) }}"

    - name: Ensure IDM A records exist in each managed zone for NS
      redhat.rhel_idm.ipadnsrecord:
        zone_name: "{{ item }}"
        name: "{{ inventory_hostname | regex_replace('\\.' + item + '\\.?$', '') }}"
        record_type: A
        record_value: "{{ idm_ip | default(ansible_default_ipv4.address) }}"
        state: present
      loop: "{{ idm_dns_zones }}"
  post_tasks:
    # TODO| bootstrap user delete causes next play to fail with permissions on /home/ansible/.ansible/tmp
    - name: Remove local bootstrap user after IdM initialization
      become: true
      become_user: root
      ansible.builtin.shell: |
        set -o pipefail

        # Scrub the local bootstrap user from all relevant files
        find "/var/db/sudo/lectured/$(id -u {{ bootstrap_user }} 2>/dev/null || echo _missing_)" -exec rm -f {} \; 2>/dev/null || true
        sed -i "/^{{ bootstrap_user }}:/d;" /etc/{group,gshadow,passwd,shadow,subgid,subuid}{,-}
        rm -rf "/home/{{ bootstrap_user }}"
        find /etc/sudoers.d/ -type f -exec grep -l "{{ bootstrap_user }}" {} \; | xargs -r rm -f

        sss_cache -E
        # Flush SSSD caches so IdM user resolution is clean
        systemctl stop sssd
        kdestroy -A 2>/dev/null
        rm -rf /var/lib/sss/{db,mc}/*
        systemctl start sssd

        # Wait until the IdM service account resolves to IdM UID (i.e. >=1100)
        for i in $(seq 1 30); do
          uid=$(id -u "{{ bootstrap_user }}" 2>/dev/null) || { sleep 2; continue; }

          [ "$uid" -ge 1100 ] || { sleep 2; continue; }

          sudo -l -U "{{ bootstrap_user }}" 2>/dev/null | grep -q '(ALL' || { sleep 2; continue; }

          break
        done

        if ! [ -d "/home/{{ bootstrap_user }}" ]; then
          cp -r /etc/skel "/home/{{ bootstrap_user }}"
          mkdir -p "/home/{{ bootstrap_user }}/.ansible/tmp"
          chown -R {{ bootstrap_user }}:{{ bootstrap_user }} "/home/{{ bootstrap_user }}"
        fi
      changed_when: true
      when: bootstrap_user is defined and bootstrap_user | length > 0
