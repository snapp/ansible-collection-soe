---

argument_specs:
  main:
    short_description: Register a Red Hat Identity Management (IdM) service principal and manage its TLS certificate
    description:
      - Ensures a Kerberos service principal exists in Red Hat Identity Management (IdM) for a host and, when TLS is enabled,
        requests a certificate for it from the IdM certificate authority through certmonger, keeping the certificate,
        private key and CA chain under a directory owned by the service account.
      - Additional service names listed as Subject Alternative Names (SANs) inside the IdM domain receive a DNS CNAME record
        pointing at the host and are added to the principal as aliases.
      - The host must already be enrolled in IdM (see infra.soe.redhat_idm_register). The role is composed by the product
        roles infra.soe.redhat_satellite, infra.soe.redhat_keycloak, infra.soe.redhat_ansible_automation_platform and
        infra.soe.redhat_cockpit, and can be run on its own through the redhat_idm_service playbook.
    options:
      redhat_idm_service_admin_password:
        type: str
        required: true
        no_log: true
        description:
          - Secret. Password of the IdM administrator used to create the DNS records and the service principal.
          - Composing roles pass their own <role>_idm_admin_password through this option.

      redhat_idm_service_user:
        type: str
        default: root
        description:
          - System user that owns the TLS directory, certificate, private key and CA copy.
          - Set it to the account that runs the service which reads the certificate.

      redhat_idm_service_group:
        type: str
        default: "{{ redhat_idm_service_user }}"
        description:
          - System group that owns the TLS material.

      redhat_idm_service_fqdn:
        type: str
        default: "{{ inventory_hostname }}"
        description:
          - Host part of the service principal, the certificate subject CN and the primary DNS SAN.

      redhat_idm_service_principal:
        type: str
        default: "HTTP/{{ redhat_idm_service_fqdn }}"
        description:
          - Kerberos service principal to create.
          - The service type before the slash is reused for the alias created for every SAN.

      redhat_idm_service_tls_enabled:
        type: bool
        default: false
        description:
          - Request and track a TLS certificate with certmonger.
          - When false the role only manages the DNS records and the principal.

      redhat_idm_service_tls_request_id:
        type: str
        default: idm_service
        description:
          - certmonger tracking identifier passed to ipa-getcert.
          - Also names the directory under /etc/pki that holds the TLS material.

      redhat_idm_service_tls_sans:
        type: list
        elements: str
        default: []
        description:
          - Additional DNS names for the certificate.
          - Each name becomes a DNS SAN and a principal alias; names inside idm_domain other than the inventory hostname
            also receive a CNAME record pointing at the host.

      redhat_idm_service_tls_dir:
        type: path
        default: "/etc/pki/{{ redhat_idm_service_tls_request_id }}"
        description:
          - Directory that holds the TLS material, created with mode 0755; its private subdirectory is created with mode 0700.

      redhat_idm_service_tls_cert:
        type: path
        default: "{{ redhat_idm_service_tls_dir }}/service.crt"
        description:
          - Path of the issued certificate, written with mode 0640.

      redhat_idm_service_tls_key:
        type: path
        default: "{{ redhat_idm_service_tls_dir }}/private/service.key"
        description:
          - Path of the private key, written with mode 0600.

      redhat_idm_service_tls_ca:
        type: path
        default: "{{ redhat_idm_service_tls_dir }}/ipa-ca.crt"
        description:
          - Path of the copy of the IdM CA certificate taken from /etc/ipa/ca.crt, written with mode 0644.

      idm_domain:
        type: str
        description:
          - Shared inventory variable. Primary DNS domain of the IdM realm, used to decide which SANs receive a CNAME record.
          - The role fails with an undefined-variable error when it is unset.

      no_log_enabled:
        type: bool
        description:
          - Shared inventory variable. Controls no_log on the tasks that handle the administrator password.
          - Unset behaves as true; set it to false only while debugging.
