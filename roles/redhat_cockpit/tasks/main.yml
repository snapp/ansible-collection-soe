---

- name: Red Hat Cockpit Certificate
  ansible.builtin.import_tasks: certificate.yml
  tags:
    - cockpit_identity_management
    - idm_configure
    - idm_service
  when: redhat_cockpit_idm_admin_password is defined

- name: Install Red Hat Cockpit
  ansible.builtin.include_tasks: install.yml
  tags: cockpit_install
  when: redhat_cockpit_enabled
