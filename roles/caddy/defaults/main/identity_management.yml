---

# Setting either this or the un-namespaced idm_admin_password enables the IdM
# integration below. Empty means the IdM tasks are skipped entirely.
caddy_idm_admin_password: "{{ idm_admin_password | default('') }}"

caddy_idm_users:
  - description: Caddy Service Account
    name:
      username: caddy
      first: Caddy
      last: Service Account
      full: Caddy Service Account
    initials: CSA
    home: /var/lib/caddy
    shell: /sbin/nologin
    enable_subid: true
