---

- name: Caddy IdM Users
  ansible.builtin.import_tasks: users.yml
  tags:
    - caddy_identity_management
    - idm_configure
    - idm_users
  when: caddy_idm_admin_password | length > 0

- name: Caddy Installation
  ansible.builtin.import_tasks: install.yml
  tags: caddy_install

- name: Caddy Configuration
  ansible.builtin.import_tasks: configure.yml
  tags: caddy_configure

- name: Caddy Firewall
  ansible.builtin.import_tasks: firewall.yml
  tags:
    - caddy_firewall
    - firewall
  when: caddy_firewall_enabled
