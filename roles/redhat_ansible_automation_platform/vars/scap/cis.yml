---

redhat_ansible_automation_platform_scap_tailoring_title: CIS L2 Server tailored for Red Hat Ansible Automation Platform (AAP) containerized

redhat_ansible_automation_platform_scap_tailoring_description: >-
  Exceptions derived from a post-install CIS L2 Server remediation run on RHEL 10 running
  AAP containerized (Controller + EDA + Hub via Podman). Each disabled rule was a
  persistent post-remediation failure whose remediation either breaks the AAP installation
  or is incompatible with the infrastructure-as-code lifecycle used in this lab.

redhat_ansible_automation_platform_scap_tailoring_exceptions:

  - name: xccdf_org.ssgproject.content_rule_grub2_password
    status: deselected
    justification: >-
      GRUB2 boot password requires interactive entry on every (re)boot.
      AAP automated patch management via Satellite content views performs
      unattended kernel-update reboots; a GRUB password silently halts the
      host at the boot menu, causing patching jobs to time out. Emergency
      physical/console access uses a separate break-glass procedure.
      CIS L2-only requirement; not present in CIS L1 Server.
    review_date: 2026-04-24

  - name: xccdf_org.ssgproject.content_rule_ensure_root_password_configured
    status: deselected
    justification: >-
      Single-user mode authentication depends on a root password being set.
      Root interactive login is intentionally disabled on all lab hosts;
      emergency access is provided via AAP credential vault break-glass
      procedure (console → sulogin bypass via rescue kernel parameter).
      Linked to grub2_password — both cover the same boot-time access-control
      layer that is incompatible with unattended automation.
    review_date: 2026-04-24

  - name: xccdf_org.ssgproject.content_rule_ensure_journald_and_rsyslog_not_active_together
    status: deselected
    justification: >-
      Both journald and rsyslog are intentionally active: rsyslog forwards
      structured logs to Red Hat Satellite Server centralized logging
      (imjournal → rsyslog → Satellite); journald provides structured local
      storage for systemd units. Configuring rsyslog to read from journald via
      imjournal and disabling journald's own syslog socket (ForwardToSyslog=no)
      satisfies the spirit of non-duplication without disabling either service.
      The automated remediation script does not handle this split-role
      configuration.
    review_date: 2026-04-24

  - name: xccdf_org.ssgproject.content_rule_service_systemd-journal-upload_enabled
    status: deselected
    justification: >-
      systemd-journal-upload forwards journal entries to a remote
      systemd-journal-remote receiver. This lab uses rsyslog → Satellite Server
      for centralized log aggregation instead. Enabling journal-upload would
      create a redundant, unmonitored log stream.
      CIS L2-only requirement; not present in CIS L1 Server.
    review_date: 2026-04-24

  - name: xccdf_org.ssgproject.content_rule_no_files_or_dirs_unowned_by_user
    status: deselected
    justification: >-
      AAP containerized deployment (Podman) creates overlay filesystem
      layers whose file entries are owned by container runtime UIDs that have
      no corresponding entries in /etc/passwd on the host. This is expected and
      unavoidable with the Podman container model: rootless containers use
      subordinate UID ranges (subuid/subgid) that are not registered as named
      users in the host NSS databases.
    review_date: 2026-04-24

  - name: xccdf_org.ssgproject.content_rule_no_files_or_dirs_ungroupowned
    status: deselected
    justification: >-
      Same cause as no_files_or_dirs_unowned_by_user. Container overlay layers
      use subordinate GID ranges (subgid) for rootless Podman that are not
      registered as named groups in /etc/group.
    review_date: 2026-04-24

  - name: xccdf_org.ssgproject.content_rule_sebool_deny_execmem
    status: deselected
    justification: >-
      AAP containerized deployment runs CA trust updates and all service
      containers via Podman. Setting deny_execmem=1 globally prevents the
      container dynamic linker (ld.so) from calling mprotect() during glibc
      RELRO relocation, causing every container to fail at startup with
      "cannot apply additional memory protection after relocation: Permission
      denied".
      CIS L2-only requirement; not present in CIS L1 Server.
    review_date: 2026-04-24

  - name: xccdf_org.ssgproject.content_rule_sshd_limit_user_access
    status: deselected
    justification: >-
      CIS L2 requires AllowUsers, AllowGroups, DenyUsers, or DenyGroups in
      sshd_config. The golden image cannot hardcode specific users or groups
      because AAP-managed hosts join different LDAP/AD realms or local group
      sets per environment. SSH access restrictions (AllowGroups) are applied
      by the AAP post-provision playbook after environment-specific group
      membership is established. Hardcoding in the image would lock out the
      bootstrap ansible service account during initial provisioning.
    review_date: 2026-04-24
