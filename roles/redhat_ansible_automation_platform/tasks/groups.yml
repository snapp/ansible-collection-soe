---

- name: groups | AAP IdM Groups
  ansible.builtin.include_role:
    name: infra.soe.redhat_idm_groups
    apply:
      tags:
        - aap_identity_management
        - idm_configure
        - idm_groups
  vars:
    redhat_idm_groups_admin_password: "{{ redhat_ansible_automation_platform_idm_admin_password }}"
    redhat_idm_groups: "{{ redhat_ansible_automation_platform_idm_groups }}"
  tags:
    - aap_identity_management
    - idm_configure
    - idm_groups
