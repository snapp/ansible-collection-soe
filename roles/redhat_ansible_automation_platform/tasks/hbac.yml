---

- name: hbac | AAP IdM HBAC rules
  ansible.builtin.include_role:
    name: infra.soe.redhat_idm_hbac
    apply:
      tags:
        - aap_identity_management
        - idm_configure
        - idm_hbac
  vars:
    redhat_idm_hbac_admin_password: "{{ redhat_ansible_automation_platform_idm_admin_password }}"
    redhat_idm_hbac_rules: "{{ redhat_ansible_automation_platform_idm_hbac_rules }}"
  tags:
    - aap_identity_management
    - idm_configure
    - idm_hbac
