---

- name: certificate | AAP IdM Service Certificate
  ansible.builtin.include_role:
    name: infra.soe.redhat_idm_service
    apply:
      tags:
        - aap_identity_management
        - idm_configure
        - idm_service
  vars:
    redhat_idm_service_admin_password: "{{ redhat_ansible_automation_platform_idm_admin_password }}"
    redhat_idm_service_principal: "{{ redhat_ansible_automation_platform_idm_service_principal }}"
    redhat_idm_service_user: "{{ redhat_ansible_automation_platform_service_user }}"
    redhat_idm_service_group: "{{ redhat_ansible_automation_platform_service_group }}"
    redhat_idm_service_tls_enabled: "{{ redhat_ansible_automation_platform_idm_service_tls_enabled }}"
    redhat_idm_service_tls_request_id: "{{ redhat_ansible_automation_platform_idm_service_request_id }}"
    redhat_idm_service_tls_sans: "{{ redhat_ansible_automation_platform_idm_service_tls_sans }}"
  tags:
    - aap_identity_management
    - idm_configure
    - idm_service
