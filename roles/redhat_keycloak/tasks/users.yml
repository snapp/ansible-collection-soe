---

- name: users | RHBK IdM Users
  ansible.builtin.include_role:
    name: infra.soe.redhat_idm_users
    apply:
      tags:
        - keycloak_identity_management
        - idm_configure
        - idm_users
  vars:
    redhat_idm_users_admin_password: "{{ redhat_keycloak_idm_admin_password }}"
    redhat_idm_users: "{{ redhat_keycloak_idm_users }}"
  tags:
    - keycloak_identity_management
    - idm_configure
    - idm_users
