---

- name: hbac | Red Hat Build of Keycloak (RHBK) IdM HBAC rules
  ansible.builtin.include_role:
    name: infra.soe.redhat_idm_hbac
    apply:
      tags:
        - keycloak_identity_management
        - idm_configure
        - idm_hbac
  vars:
    redhat_idm_hbac_admin_password: "{{ redhat_keycloak_idm_admin_password }}"
    redhat_idm_hbac_rules: "{{ redhat_keycloak_idm_hbac_rules }}"
  tags:
    - keycloak_identity_management
    - idm_configure
    - idm_hbac
