---

argument_specs:
  main:
    short_description: Manage Red Hat Identity Management (IdM) sudo rules
    description:
      - Creates or updates centrally managed sudo rules with the redhat.rhel_idm.ipasudorule module, so that privilege
        escalation on every enrolled host is defined once in IdM instead of in local sudoers files.
      - The role is composed by infra.soe.redhat_identity_management for the site-wide rules and can be run on its own
        against an IdM server.
      - The module runs on the target host, which must be an IdM server or an enrolled client with the IdM Python
        libraries installed.
    options:
      redhat_idm_sudo_admin_password:
        type: str
        required: true
        no_log: true
        description:
          - Secret. IdM administrator password used by the ipasudorule module.

      redhat_idm_sudo_rules:
        type: list
        elements: dict
        description:
          - Rules to manage. Unset manages none.
          - Each item has name and description (both required) and the optional users and hosts lists, the
            runasusercategory, runasgroupcategory, hostcategory and cmdcategory keys (all to match everything of that
            kind) and options, a list of sudo options such as !authenticate. Rules are always ensured present.

      no_log_enabled:
        type: bool
        description:
          - Shared inventory variable. Controls no_log on the rule task, which also hides the loop items. Unset behaves as
            true.
