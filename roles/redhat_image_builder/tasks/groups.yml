---

- name: groups | Red Hat Image Builder IdM Groups
  ansible.builtin.include_role:
    name: infra.soe.redhat_idm_groups
    apply:
      tags:
        - image_builder_identity_management
        - idm_configure
        - idm_groups
  vars:
    redhat_idm_groups_admin_password: "{{ redhat_image_builder_idm_admin_password }}"
    redhat_idm_groups: "{{ redhat_image_builder_idm_groups }}"
  tags:
    - image_builder_identity_management
    - idm_configure
    - idm_groups
