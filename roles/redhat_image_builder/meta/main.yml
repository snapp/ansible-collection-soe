---

dependencies:
  - name: Red Hat Image Builder IdM Groups
    role: infra.soe.redhat_idm_groups
    vars:
      redhat_idm_groups_admin_password: "{{ redhat_image_builder_idm_admin_password }}"
      redhat_idm_groups: "{{ redhat_image_builder_idm_groups }}"
    tags:
      - image_builder_identity_management
      - idm_configure
      - idm_groups
    when: redhat_image_builder_idm_admin_password is defined

  - name: Red Hat Image Builder IdM HBAC rules
    role: infra.soe.redhat_idm_hbac
    vars:
      redhat_idm_hbac_admin_password: "{{ redhat_image_builder_idm_admin_password }}"
      redhat_idm_hbac_rules: "{{ redhat_image_builder_idm_hbac_rules }}"
    tags:
      - image_builder_identity_management
      - idm_configure
      - idm_hbac
    when: redhat_image_builder_idm_admin_password is defined

  - name: Red Hat Image Builder Firewall
    role: infra.soe.firewall
    vars:
      firewall_enabled: "{{ redhat_image_builder_firewall_enabled }}"
      firewall: "{{ redhat_image_builder_firewall }}"
      firewall_log_denied: "{{ redhat_image_builder_firewall_log_denied }}"
      firewall_disable_conflicting_services: "{{ redhat_image_builder_firewall_disable_conflicting_services }}"
    tags:
      - image_builder_firewall
      - firewall
    when: redhat_image_builder_firewall_enabled
