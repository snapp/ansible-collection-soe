---

- name: users | Red Hat Satellite IdM Users
  ansible.builtin.include_role:
    name: infra.soe.redhat_idm_users
    apply:
      tags:
        - satellite_identity_management
        - idm_configure
        - idm_users
  vars:
    redhat_idm_users_admin_password: "{{ redhat_satellite_idm_admin_password }}"
    redhat_idm_users: "{{ redhat_satellite_idm_users }}"
  tags:
    - satellite_identity_management
    - idm_configure
    - idm_users
