---

- name: network | Ensure required ansible_facts have been gathered
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - '!min'
      - 'network'
  when: ansible_facts.default_ipv4.address is not defined

- name: network | Ensure Satellite Server resolves its own IPv4 Address to its FQDN
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE SATELLITE SERVER"
    block: |
      {{ ansible_default_ipv4.address }} {{ inventory_hostname }} {{ inventory_hostname_short }}
    state: present

- name: network | Disable IPv6
  ansible.builtin.copy:
    dest: /etc/sysctl.d/ipv6.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Red Hat Satellite services require IPv6 address on the loopback interface
      # https://access.redhat.com/solutions/5045841
      net.ipv6.conf.all.disable_ipv6 = 1
      net.ipv6.conf.lo.disable_ipv6 = 0
  notify:
    - Reload sysctl
    - Rebuild Initial RAM Disk Image
