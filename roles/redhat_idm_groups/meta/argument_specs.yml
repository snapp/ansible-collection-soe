---

argument_specs:
  main:
    short_description: Manage Red Hat Identity Management (IdM) groups and their membership
    description:
      - Creates or updates IdM groups with the redhat.rhel_idm.ipagroup module, setting the GID, description, member users
        and nested member groups of each entry.
      - The role is composed by infra.soe.redhat_identity_management for the site-wide groups and by every product role
        for its own administrator and user groups (for example satellite-admins or aap-users), each passing its own
        administrator password. It can also be run on its own against an IdM server.
      - The modules run on the target host, which must be an IdM server or an enrolled client with the IdM Python
        libraries installed.
    options:
      redhat_idm_groups_admin_password:
        type: str
        required: true
        no_log: true
        description:
          - Secret. IdM administrator password used by the ipagroup module.

      redhat_idm_groups:
        type: list
        elements: dict
        description:
          - Groups to manage. Unset manages none.
          - Each item has name and description (both required) and the optional gid (int), users (member user names) and
            groups (member group names) keys. Groups are always ensured present.

      no_log_enabled:
        type: bool
        description:
          - Shared inventory variable. Controls no_log on the group task, which also hides the loop items. Unset behaves
            as true.
