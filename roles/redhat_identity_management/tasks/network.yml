---

- name: network | Ensure required ansible_facts have been gathered
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - '!min'
      - 'network'
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ ((groups['idm_server'] | default([])) + (groups['idm_replica'] | default([]))) | unique | sort }}"

- name: network | Ensure canonical hostname is statically set
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: network | Ensure IdM peers resolve locally via /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE IDM HOSTS"
    block: |
      {% for h in ((groups['idm_server'] | default([])) + (groups['idm_replica'] | default([]))) | unique | sort %}
      {{ hostvars[h].ansible_default_ipv4.address }} {{ h }} {{ h.split('.')[0] }}
      {% endfor %}
    state: present
