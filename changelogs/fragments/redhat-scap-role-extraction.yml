---
breaking_changes:
  - redhat_scap - the ``scap_remediation`` playbook was replaced by
    ``redhat_scap``, backed by a new ``infra.soe.redhat_scap`` role. Update any
    references to ``infra.soe.scap_remediation`` and rename the inventory
    variables, which lost their bare ``scap_`` prefix in favour of
    ``redhat_scap_`` - for example ``scap_profile`` is now
    ``redhat_scap_profile``.
minor_changes:
  - redhat_scap - SCAP remediation is now available both as a standalone
    playbook and as a per-product concern. Product roles that define a
    ``<role>_scap_profile`` load their own CIS tailoring from
    ``vars/scap/<profile>.yml`` and delegate to this role, so exemptions can be
    justified and reviewed per product rather than in one site-wide list.
bugfixes:
  - redhat_scap - removed an unconditional, untagged debug task that printed the
    SCAP profile on every run.
