---

minor_changes:
  - Every role now ships a ``meta/argument_specs.yml`` whose defaults match ``defaults/`` literally, a ``meta/main.yml`` with evidenced platforms (EL 9 and 10; Fedora for ``application_server``, ``firewall``, ``local_storage`` and ``local_users``; Windows for ``local_users`` and ``ping``) and descriptive galaxy tags, and a README with a generated variables section, the shared inventory variables it consumes, its composition, every tag it responds to, security considerations and operational notes. Argument specs are validated when a role starts, so a wrong type or a missing required input (``caddy_domains``, the four ``netbird_*`` secrets, ``redhat_identity_management_admin_password``, the ``redhat_idm_*_admin_password`` inputs, ``bootstrap_directory`` and ``rhc_server``, all of which the roles already failed without) now fails early with a clear message.
  - README - the collection README describes the reference implementation and its thesis, the ``site.yml`` build order as a sixteen-stage narrative, every role and playbook, the shared inventory variable contract between the collection and a site repository, the Automation Hub token the dependencies need, use cases, testing, support and the roadmap.
  - CONTRIBUTING.md and AGENTS.md - the documentation conventions (terminology, README structure, argument spec and ``meta/main.yml`` rules, shared variable contract) are written down with their sources, together with the changelog fragment workflow.
  - galaxy.yml - a descriptive ``description``, more ``tags`` and the ``documentation`` and ``homepage`` links; ``.ansible``, ``.cache``, built tarballs, ``tools``, ``AGENTS.md`` and ``CLAUDE.md`` are excluded from the artifact. A local build previously bundled the gitignored dependency cache into a 44 MB tarball.
  - tools - ``tools/render_role_docs.py`` renders the README variable tables from the argument specs and checks for drift between README, spec and ``defaults/``; a ``role-docs`` pre-commit hook enforces it.
  - redhat_ansible_automation_platform - the SCAP tailoring justifications no longer describe the deployment as a lab, and the commented installer inventory examples use the documented host name grammar.

bugfixes:
  - redhat_image_builder - the argument spec typed ``redhat_image_builder_repositories`` as a list although its default is omitted when ``satellite_baseurl`` is unset, so validation failed on the default in that case; the option is now ``raw``. The spec also documented a default for ``redhat_image_builder_users`` that ``defaults/`` never set and omitted ``redhat_image_builder_idm_admin_password`` and the SCAP inputs.
  - redhat_idm_service - the argument spec documented ``redhat_idm_service_group`` as defaulting to ``root`` while ``defaults/`` sets it to ``redhat_idm_service_user``, and omitted the administrator password, ``idm_domain`` and ``no_log_enabled`` that the tasks read; the spec now matches the role.
  - reboot - the README was a copy of the ``ping`` README; it now documents the role. ``meta/main.yml`` no longer claims Windows support, as the Windows task file contains no tasks.
  - netbird - the README, the defaults comments and the reference Caddyfile referenced the sibling ``infra.apps`` collection, an ``ite`` inventory group and an ``ai_webui`` role, and linked ``files/caddy_netbird.conf`` relatively; they now describe ``infra.soe.netbird`` and the ``netbird`` group, link by full URL, and state that the identity-provider registration tasks are present but disabled.
