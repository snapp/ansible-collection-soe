---
breaking_changes:
  - >-
    site - the site playbook no longer runs a site-wide SCAP pass. It previously
    ended by importing ``scap_remediation.yml``, which remediated every host
    against one profile. SCAP is now a per-product concern: the
    ``redhat_identity_management``, ``redhat_satellite``, ``redhat_keycloak``,
    ``redhat_ansible_automation_platform`` and ``redhat_image_builder`` roles
    each remediate with their own tailoring when a ``<role>_scap_profile`` is
    set. Hosts that are not covered by one of those roles are no longer
    remediated by ``site``; run the ``redhat_scap`` playbook against them, or add
    it back to your own site playbook.
minor_changes:
  - >-
    site - the playbook gained the ``caddy``, ``netbird`` and ``reboot`` imports,
    and ``firewall`` moved to second-to-last so that host firewalling is applied
    after the services that declare their own ports have been installed.
