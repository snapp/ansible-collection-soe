---
minor_changes:
  - >-
    redhat_satellite - the three plays of the ``redhat_satellite`` playbook
    became a single role, with the lifecycle split across ``tasks/network.yml``,
    ``install.yml``, ``realm.yml``, ``certificate.yml`` and ``configure.yml``,
    and the firewall and SCAP concerns delegated to ``infra.soe.firewall`` and
    ``infra.soe.redhat_scap``.
  - >-
    redhat_satellite - dropped the dependency on the
    ``redhat.satellite.host_collections`` role, which is not part of the
    published ``redhat.satellite`` collection, in favour of looping the published
    ``redhat.satellite.host_collection`` module over
    ``satellite_host_collections``. The collection no longer needs a patched
    ``redhat.satellite`` to run the Satellite playbook.
  - >-
    redhat_satellite - added defaults for ``redhat_satellite_idm_groups`` and
    ``redhat_satellite_idm_hbac_rules``, matching the shape already shipped by
    ``redhat_ansible_automation_platform`` and ``redhat_image_builder``. They
    create ``satellite-admins`` and ``satellite-users`` groups and an
    ``allow_satellite`` HBAC rule covering both.
bugfixes:
  - >-
    redhat_satellite - ``tasks/groups.yml`` and ``tasks/hbac.yml`` consumed
    ``redhat_satellite_idm_groups`` and ``redhat_satellite_idm_hbac_rules``
    without either being defined anywhere, so enabling the IdM integration
    failed with an undefined-variable error. Both now have defaults.
