---
minor_changes:
  - >-
    redhat_cockpit, redhat_keycloak - IdM composition converged on the same
    shape as the other product roles: a per-concern ``tasks/`` shim that calls
    the relevant ``infra.soe.redhat_idm_*`` role through ``include_role`` and
    maps the caller's namespaced variables onto the leaf role's. Previously each
    playbook set a play-level ``ipaadmin_password`` that the leaf roles read as a
    shared variable, which meant every role in a play had to use the same IdM
    identity.
breaking_changes:
  - >-
    redhat_cockpit, redhat_keycloak - the IdM inputs are namespaced per role.
    ``redhat_cockpit_idm_admin_password`` and
    ``redhat_keycloak_idm_admin_password`` replace the generic
    ``idm_admin_password``, and ``redhat_keycloak_idm_users`` and
    ``redhat_keycloak_idm_groups`` replace the bare ``redhat_idm_users`` and
    ``redhat_idm_groups``. Both passwords fall back to ``idm_admin_password``
    when unset, so existing inventories keep working, but the user and group
    lists must be renamed.
